(() => {
  "use strict";

  const DAY = 86400000;

      localStorage.removeItem("__kotoba_test__");
      return true;
    } catch (_) {
      return false;
    }
  })();

  let progress = {};
  let testProgress = {};
  if (storageAvailable) {
    try { progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {}; } catch (_) { progress = {}; }
    try { testProgress = JSON.parse(localStorage.getItem(TEST_STORAGE_KEY) || "{}") || {}; } catch (_) { testProgress = {}; }
  }

  const categoryNames = [ALL, ...categoryMeta.map((category) => category.name)];
  const markOf = new Map(categoryMeta.map((category) => [category.name, category.mark]));
  const saved = prefs("words");
  const state = {
    category: categoryNames.includes(saved.category) ? saved.category : ALL,
    mode: MODE_IDS.includes(saved.mode) ? saved.mode : "all",
    order: cards.map((card) => card.id),
    index: 0,
    flipped: false,
    autoplay: Boolean(saved.autoplay),
  };
  let ui = null;

  function save() {
    if (storageAvailable) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (_) {}
    }
    updateBadges();
  }

  function shuffle(input) {
    const output = [...input];
    for (let i = output.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [output[i], output[j]] = [output[j], output[i]];
    }
    return output;
  }

  function isTestGraduated(cardId) {
    const modes = testProgress[cardId]?.modes || {};
    return TEST_MODE_IDS.every((modeId) => Boolean(modes[modeId]?.graduated));
  }

  function filteredCards() {
    const now = Date.now();
    const categoryCards = state.category === ALL ? cards : cards.filter((card) => card.category === state.category);
    let visible = state.mode === "graduated"
      ? categoryCards.filter((card) => isTestGraduated(card.id))
      : categoryCards.filter((card) => !isTestGraduated(card.id));
    if (state.mode === "due") {
      visible = visible.filter((card) => progress[card.id]?.reviews > 0 && progress[card.id].due <= now);
    } else if (state.mode === "new") {
      visible = visible.filter((card) => !progress[card.id]?.reviews);
    }
    const rank = new Map(state.order.map((id, index) => [id, index]));
    return [...visible].sort((a, b) => (rank.get(a.id) ?? 9999) - (rank.get(b.id) ?? 9999));
  }

  function stats() {
    const now = Date.now();
    return {
      studied: cards.filter((card) => progress[card.id]?.reviews > 0).length,
      strong: cards.filter((card) => progress[card.id]?.level >= 4).length,
      due: cards.filter((card) => !isTestGraduated(card.id) && progress[card.id]?.reviews > 0 && progress[card.id].due <= now).length,

  }

  function formatDue(timestamp) {

  }

  function currentDeckState() {

  }

  const categoryCount = (name) => (name === ALL ? cards.length : cards.filter((card) => card.category === name).length);
  const knowInterval = (card) => ["", "1 天后", "3 天后", "7 天后", "14 天后", "30 天后"][Math.min(5, (progress[card.id]?.level || 0) + 1)];

  /* ---------- markup ---------- */
  function categoryItems() {

  }

  function frontFace(card) {
    return `<span class="face-tag">${esc(card.category)}</span>

  }

  function backFace(card) {

      </div>`;
  }

  function actionCenter(card) {

      <button class="again" type="button" data-action="again"><span class="kbd">1</span>再练<small>10 分钟后</small></button>
      <button class="hard" type="button" data-action="hard"><span class="kbd">2</span>模糊<small>明天</small></button>

  function progressMarkup(card, summary) {

    const completion = Math.round((summary.studied / cards.length) * 100);

      </section>
      ${card ? `<section class="panel"><h3>这张卡</h3>
        <div class="mode-row-head"><span>熟练度</span><b class="num">${item.level} / 5</b></div>

  }

  function stageMarkup() {

    }
    return `<div class="stage-meta"><span id="deck-position">${state.index + 1} / ${deck.length}</span><div class="bar"><span id="deck-bar" style="width:${((state.index + 1) / deck.length) * 100}%"></span></div>
        <span class="compact-stats">待复习 <b class="num" id="compact-due">${summary.due}</b> · 已学 <b class="num" id="compact-studied">${summary.studied}</b></span></div>

  }

  function updateTitle() {

  function updateModeRow(summary) {
    ui.modeRow.querySelectorAll("[data-mode]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode)));

  function updateCard(direction = 1) {

  function rate(rating) {

    const card = deck[state.index] || deck[0];
    if (!card || !state.flipped) return;
    const previous = progress[card.id] || { level: 0, due: 0, reviews: 0, misses: 0 };
    let level = previous.level;
    let due = Date.now();
    let misses = previous.misses;
    if (rating === "again") {
      level = Math.max(0, previous.level - 1);
      due += 10 * 60 * 1000;
      misses += 1;
    } else if (rating === "hard") {
      level = Math.max(1, previous.level);
      due += DAY;
    } else {
      level = Math.min(5, previous.level + 1);
      due += intervals[level];

    if (after.length === deck.length) state.index = (state.index + 1) % after.length;
    else if (state.index >= after.length) state.index = 0;
    updateModeRow(stats());
    if (!after.length) renderStage();
    else updateCard(1);

        </div>
        <div class="page-actions words-head-actions">
          <div class="seg" id="mode-row" role="group" aria-label="学习范围">
            <button type="button" data-mode="all">全部</button>
            <button type="button" data-mode="due">今日复习 <span class="pill" id="due-count" hidden></span></button>
            <button type="button" data-mode="new">未学</button>
            <button type="button" data-mode="graduated">已毕业 <span class="pill neutral" id="graduated-count" hidden></span></button>
          </div>
          <span class="head-tools">
            <button class="icon-btn" type="button" data-action="shuffle" aria-label="打乱顺序" title="打乱顺序">${ICON.shuffle}</button>
            <button class="icon-btn" type="button" data-action="autoplay" aria-pressed="${state.autoplay}" aria-label="自动朗读" title="翻到新卡时自动朗读">${ICON.speaker}</button>
          </span>
        </div>
      </header>
      <div class="study-layout">
        <section class="stage" id="study-stage" aria-label="闪卡"></section>
        <aside class="side-panel" id="progress-panel" aria-label="学习进度"></aside>
      </div>`;

    ui = {
      eyebrow: document.getElementById("deck-eyebrow"),
      title: document.getElementById("deck-title"),
      titleShort: document.getElementById("deck-title-short"),
      modeRow: document.getElementById("mode-row"),
      dueCount: document.getElementById("due-count"),
      graduatedCount: document.getElementById("graduated-count"),
      studyStage: document.getElementById("study-stage"),
      progressPanel: document.getElementById("progress-panel"),
    };
    renderSidebar();
    updateTitle();
    updateModeRow(stats());
    renderStage();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (event) => {
    const target = event.target.closest("button, [data-action], [data-category], [data-mode]");
    if (!target) return;
    const { category, mode, action } = target.dataset;
    if (category) {
      if (target.closest("#picker")) closeDialog(picker);
      selectCategory(category);
      return;
    }
    if (mode) {
      selectMode(mode);
      return;
    }
    switch (action) {
      case "flip":
      case "reveal":
        flipCard();
        break;
      case "previous": stepCard(-1); break;
      case "next": stepCard(1); break;
      case "again":
      case "hard":
      case "know":
        rate(action);
        break;
      case "shuffle":
        state.order = shuffle(state.order);
        state.index = 0;
        updateCard(1);
        toast("已打乱顺序");
        break;
      case "autoplay":
        state.autoplay = !state.autoplay;
        target.setAttribute("aria-pressed", String(state.autoplay));
        savePrefs("words", { autoplay: state.autoplay });
        toast(state.autoplay ? "翻到新卡时会自动朗读" : "已关闭自动朗读");
        break;
      case "speak-card": {
        const { card } = currentDeckState();
        if (card) speak(card.kana);
        break;
      }
      case "speak-example": {
        const { card } = currentDeckState();
        if (card) speak(card.example);
        break;
      }
      case "picker": openPicker(); break;
      case "reset":
        if (confirm("确定要清除全部闪卡学习记录吗？这项操作不能撤销。")) {
          progress = {};
          save();
          state.mode = "all";
          state.index = 0;
          state.flipped = false;
          updateModeRow(stats());
          renderStage();
          toast("闪卡记录已清除");
        }
        break;
      default:
        break;
    }
  });

  window.addEventListener("keydown", (event) => {
    if (isTyping(event.target) || document.querySelector("dialog[open]")) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.code === "Space") {
      event.preventDefault();
      flipCard();
    } else if (event.key === "ArrowRight") stepCard(1);
    else if (event.key === "ArrowLeft") stepCard(-1);
    else if (state.flipped && event.key === "1") rate("again");
    else if (state.flipped && event.key === "2") rate("hard");
    else if (state.flipped && event.key === "3") rate("know");
    else if (event.key === "p" || event.key === "P") speakCurrent();
  });

  renderShell();
  KotobaUI.init();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/japanese/sw.js", { scope: "/japanese" }).catch(() => {});
    });
  }
})();
  </script>
</body>
</html>
